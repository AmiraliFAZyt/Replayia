adding:12px;margin-top:12px;white-space:pre-wrap;font-size:12px}.commentrow button{width:auto}.receipt{font-size:11px;color:var(--accent);margin-top:10px}#message{position:sticky;top:12px;z-index:9;background:#173a2b;border:1px solid #376a51;border-radius:12px;padding:14px 18px;margin-bottom:18px;white-space:pre-wrap;font-size:12px}#message.error{background:#381f21;border-color:#855252;color:#ffc1bb}footer{display:flex;justify-content:space-between;gap:15px;color:#697d8c;font-size:10px;margin-top:32px}footer span:first-child{direction:ltr}body[aria-busy=true]{cursor:progress}body[aria-busy=true] button{opacity:.45;pointer-events:none}@media(max-width:760px){.shell{padding:20px 14px}.grid{grid-template-columns:1fr}.rulegrid{grid-template-columns:1fr 1fr;gap:13px}.card{padding:18px}header{align-items:flex-start}.pill{font-size:9px;padding:5px 8px}h1{font-size:21px}.brand{gap:10px}.brand p{max-width:190px}.logo{width:43px;height:43px;border-radius:13px}footer{flex-direction:column;gap:3px}.notice{font-size:11px}}@media(max-width:420px){.rulegrid{grid-template-columns:1fr}.stats strong{font-size:22px}}

<body>
<div class="shell">
<header><div class="brand"><div class="logo">R.</div><div><h1 data-t="brand"></h1><p data-t="subtitle"></p></div></div><div class="headeractions"><span id="mode" class="pill">WEB EDITION</span><button id="logout" type="button" disabled class="logout" hidden data-t="logout"></button></div></header>
<div class="notice"><strong data-t="noticeTitle"></strong><span data-t="notice"></span></div>
<div id="message" role="status" aria-live="polite" hidden></div>
<section id="unlockCard" class="card narrow">
<div class="cardhead"><span class="step">01</span><div><h2 data-t="unlockTitle"></h2><p data-t="unlockNote"></p></div></div>
<form id="unlockForm"><label for="panelKey" data-t="panelKey"></label><input id="panelKey" type="hidden" autocomplete="off" required dir="ltr" minlength="32" maxlength="256"><button class="primary" type="submit" data-t="unlock"></button></form>
</section>
<main id="workspace" hidden>
<div class="grid">
<section class="card">
<div class="cardhead"><span class="step">01</span><div><h2 data-t="connection"></h2><p data-t="sessionNote"></p></div></div>
<div id="accountLine" class="account"><span class="dot"></span><span id="accountName" data-t="disconnected"></span></div>
<p id="demoNote" class="demoNote" data-t="demoNote" hidden></p><form id="loginForm">
<label for="username" data-t="username"></label><input id="username" dir="ltr" autocomplete="username" spellcheck="false" pattern="[A-Za-z0-9._]{1,30}" required>
<label for="password" data-t="password"></label><input id="password" dir="ltr" type="password" autocomplete="current-password" required maxlength="256">
<label for="code" data-t="code"></label><input id="code" dir="ltr" type="text" autocomplete="one-time-code" inputmode="numeric" maxlength="20">
<label class="check"><input id="ownAccount" type="checkbox" required><span data-t="ownAccount"></span></label>
<button class="primary" type="submit" data-t="connect"></button>
</form>
<button id="disconnect" type="button" class="secondary" hidden data-t="forget"></button>
<p class="footnote" data-t="forgetNote"></p>
</section>
<section class="card">
<div class="cardhead"><span class="step">02</span><div><h2 data-t="choosePost"></h2><p data-t="postNote"></p></div></div>
<button id="loadPosts" class="secondary" type="button" data-t="loadPosts"></button>
<label for="postSelect" data-t="post"></label><select id="postSelect"><option value="" data-t="loadFirst"></option></select>
<button id="loadComments" class="primary" type="button" data-t="readComments"></button>
<div class="stats"><div><strong id="commentCount">0</strong><span data-t="commentsCount"></span></div><div><strong id="attemptCount">0 / 5</strong><span data-t="attemptsCount"></span></div></div>
<p class="footnote" data-t="limitNote"></p>
</section>
</div>
<section class="card rule">
<div class="cardhead"><span class="step">03</span><div><h2 data-t="ruleTitle"></h2><p data-t="ruleNote"></p></div></div>
<form id="ruleForm">
<div class="rulegrid"><div><label for="tester" data-t="tester"></label><input id="tester" dir="ltr" required pattern="[A-Za-z0-9._]{1,30}" spellcheck="false"><small data-t="testerNote"></small></div><div><label for="keyword" data-t="keyword"></label><input id="keyword" required maxlength="100"></div><div><label for="matchMode" data-t="matchMode"></label><select id="matchMode"><option value="word" data-t="word"></option><option value="contains" data-t="contains"></option><option value="exact" data-t="exact"></option></select></div><div><label for="action" data-t="action"></label><select id="action"><option value="dm" data-t="dm"></option><option value="comment" data-t="comment"></option></select></div></div>
<label for="reply" data-t="reply"></label><textarea id="reply" required maxlength="1000" rows="3"></textarea><small data-t="placeholderNote"></small>
<button type="submit" class="primary compact" data-t="preview"></button>
</form></section>
<section class="card"><div class="cardhead"><span class="step">04</span><div><h2 data-t="results"></h2><p data-t="resultsNote"></p></div></div><div id="rows"><div class="empty" data-t="empty"></div></div></section>
</main>
<footer><span>REPLYA / WEB 0.2</span><span data-t="footer"></span></footer>
</div>
<script>
// Standalone demo only. All fetch calls stay in this file; no network or credentials.
(() => {
 let connected=false,attempts=0;const drafts=new Map(),done=new Set();
 const comments=[
 {id:'2001',user_id:'900002',username:'demo_tester',text:'\u0633\u0644\u0627\u0645\u060c \u0642\u06cc\u0645\u062a\u061f'},
 {id:'2002',user_id:'900003',username:'other_user',text:'\u0642\u06cc\u0645\u062a\u061f'},
 {id:'2003',user_id:'900002',username:'demo_tester',text:'\u0639\u0627\u0644\u06cc\u0647'}];
 const norm=s=>s.normalize('NFKC').toLowerCase().replace(/[\u064a\u0649]/g,'\u06cc').replace(/\u0643/g,'\u06a9')
 .replace(/[\u200c\u200d]/g,' ').replace(/[\ufeff\u0640]/g,'').replace(/[\u06f0-\u06f9]/g,c=>String(c.charCodeAt(0)-0x6f0))
 .replace(/[\u0660-\u0669]/g,c=>String(c.charCodeAt(0)-0x660)).replace(/\p{Mn}/gu,'').replace(/\s+/g,' ').trim();
 const match=(t,k,m)=>{t=norm(t);k=norm(k);if(!k)return false;if(m==='exact')return t===k;if(m==='contains')return t.includes(k);
 const e=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');return new RegExp('(?<![\\p{L}\\p{N}_])'+e+'(?![\\p{L}\\p{N}_])','u').test(t);};
 const response=(data,status=200)=>Promise.resolve(new Response(JSON.stringify(data),{status,headers:{'Content-Type':'application/json'}}));
 window.fetch=async (url,options={})=>{
 const path=String(url);const p=options.body?JSON.parse(options.body):{};
 if(path==='/auth/status'||path==='/auth/login')return response({authenticated:true,csrf:'offline-demo-only',mode:'demo'});
 if(path==='/auth/logout'){connected=false;drafts.clear();return response({logged_out:true});}
 const status=()=>({mode:'demo',account:connected?{id:'900001',username:'demo_owner'}:null,paused:null,attempts_today:attempts,limit:5});
 if(path==='/api/status')return response(status());
 if(path==='/api/login'){connected=true;return response(status());}
 if(path==='/api/disconnect'){connected=false;drafts.clear();return response({forgotten_on_server:true});}
 if(!connected)return response({error:'not_connected'},409);
 if(path==='/api/posts')return response({posts:[{id:'10001_900001',caption:'\u067e\u0633\u062a \u0622\u0632\u0645\u0627\u06cc\u0634\u06cc \u0631\u06cc\u067e\u0644\u0627\u06cc\u0627',comments:3}]});
 if(path==='/api/comments')return response({comments,one_page_only:true});
 if(path==='/api/preview'){
 drafts.clear();
 const rows=comments.map(c=>{
 let reason=c.username.toLowerCase()!==p.tester.toLowerCase()?'not_tester':!match(c.text,p.keyword,p.mode)?'no_match':null;
 const key=c.id+':'+p.action;if(!reason&&done.has(key))reason='already_attempted';
 const row={comment_id:c.id,text:c.text,username:c.username,reason,action:p.action};
 if(!reason){row.token='offline-demo-token-'+c.id+'-'+p.action;row.reply=p.reply.replaceAll('{username}',c.username);drafts.set(row.token,{...row,key});}
 return row;});return response({rows});
 }
 if(path==='/api/send'){
 const d=drafts.get(p.token);if(!p.confirmed)return response({error:'confirmation_required'},400);
 if(!d)return response({error:'expired_preview'},409);if(attempts>=5)return response({error:'test_limit'},429);
 if(done.has(d.key))return response({error:'already_attempted'},409);
 attempts++;done.add(d.key);drafts.delete(p.token);
 return response({state:'demo_only',receipt_id:'offline-demo-'+attempts,delivery_verified:false});
 }
 return response({error:'offline_demo_only'},404);
 };
})();

function message(text, error=false){$('message').hidden=false;$('message').textContent=text;$('message').className=error?'error':'';}
function lockPanel(){
 csrf='';$('workspace').hidden=true;$('unlockCard').hidden=false;$('logout').hidden=true;
 ['panelKey','password','code','username'].forEach(id=>$(id).value='');clearRows();$('postSelect').replaceChildren();
}
async function request(path,payload){
 const headers={};const options={headers,cache:'no-store',credentials:'same-origin'};
 if(payload!==undefined){options.method='POST';headers['Content-Type']='application/json';headers['X-CSRF-Token']=csrf;options.body=JSON.stringify(payload);}
 let response,data;
 try {response=await fetch(path,options);data=await response.json();} catch(e){throw new Error(T.networkError);}
 if(!response.ok){const code=data.error||'internal_error';if(code==='session_required')lockPanel();throw new Error((errors[code]||T[code]||'Operation failed')+'\n['+code+']');}
 return data;
}
async function api(path,payload){return request('/api/'+path,payload);}
function demoFields(){
 const demo=mode==='demo';
 ['username','password','code'].forEach(id=>{
  $(id).hidden=demo;
  const label=document.querySelector('label[for="'+id+'"]');if(label)label.hidden=demo;
 });
 $('username').required=!demo;$('password').required=!demo;
 $('ownAccount').closest('label').hidden=demo;$('ownAccount').checked=demo;
 $('demoNote').hidden=!demo;
 $('loginForm').querySelector('button').textContent=demo?T.demoConnect:T.connect;
 if(demo){$('tester').value='demo_tester';}
}
async function openWorkspace(){
 await refreshStatus();$('panelKey').value='';$('unlockCard').hidden=true;$('workspace').hidden=false;$('logout').hidden=false;demoFields();
}
async function task(fn){
 if(busy)return;busy=true;document.body.setAttribute('aria-busy','true');
 try{await fn();}catch(e){message(e.message || 'Connection failed',true);}
 finally{busy=false;document.body.removeAttribute('aria-busy');}
}
function clearRows(){const n=document.createElement('div');n.className='empty';n.textContent=T.empty;$('rows').replaceChildren(n);$('commentCount').textContent='0';}
async function refreshStatus(){
 const s=await api('status');mode=s.mode;$('mode').textContent=mode==='demo'?'DEMO / NO INSTAGRAM':'PRIVATE / EXPERIMENTAL';
 $('accountName').textContent=s.account?'@'+s.account.username+(s.paused?' / PAUSED':''):T.disconnected;
 $('accountLine').classList.toggle('connected',!!s.account&&!s.paused);
 $('attemptCount').textContent=s.attempts_today+' / '+s.limit;
 $('loginForm').hidden=!!s.account&&!s.paused;$('disconnect').hidden=!s.account&&!s.paused;
 if(s.paused)message((errors[s.paused]||s.paused)+'\n['+s.paused+']',true);
 return s;
}
$('unlockForm').addEventListener('submit',event=>{event.preventDefault();task(async()=>{
 const payload={password:$('panelKey').value};$('panelKey').value='';
 try{const result=await request('/auth/login',payload);csrf=result.csrf;await openWorkspace();$('message').hidden=true;}
 finally{payload.password='';}
});});
$('logout').addEventListener('click',()=>task(async()=>{await request('/auth/logout',{});lockPanel();$('message').hidden=true;}));
$('loginForm').addEventListener('submit',event=>{event.preventDefault();task(async()=>{
 if(!$('ownAccount').checked)return;
 const payload=mode==='demo'?{username:'demo_owner',password:'demo',code:'',owned:true}:{username:$('username').value.trim(),password:$('password').value,code:$('code').value.trim(),owned:true};
 $('password').value='';$('code').value='';
 try{await api('login',payload);clearRows();$('postSelect').replaceChildren();await refreshStatus();message(mode==='demo'?T.demoConnected:T.connected);}
 finally{payload.password='';payload.code='';}
});});
$('disconnect').addEventListener('click',()=>task(async()=>{await api('disconnect',{});clearRows();$('postSelect').replaceChildren();await refreshStatus();message(T.forgetNote);}));
$('loadPosts').addEventListener('click',()=>task(async()=>{
 const data=await api('posts');$('postSelect').replaceChildren();clearRows();
 for(const p of data.posts){const o=document.createElement('option');o.value=p.id;o.textContent=p.caption || p.id;$('postSelect').append(o);}
 if(!data.posts.length)message(T.noPosts);
}));
$('postSelect').addEventListener('change',clearRows);
$('loadComments').addEventListener('click',()=>task(async()=>{
 const post_id=$('postSelect').value;if(!post_id)throw new Error(T.loadFirst);
 const d=await api('comments',{post_id});renderRows(d.comments);$('commentCount').textContent=d.comments.length;
}));
$('ruleForm').addEventListener('submit',event=>{event.preventDefault();task(async()=>{
 const post_id=$('postSelect').value;if(!post_id)throw new Error(T.loadFirst);
 const d=await api('preview',{post_id,keyword:$('keyword').value,mode:$('matchMode').value,reply:$('reply').value,action:$('action').value,tester:$('tester').value.trim()});renderRows(d.rows);
});});
function element(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text!==undefined)n.textContent=text;return n;}
function renderRows(rows){
 $('rows').replaceChildren();if(!rows.length){clearRows();return;}
 for(const row of rows){
 const box=element('article','commentrow');const head=element('div','rowhead');
 head.append(element('span','user','@'+row.username),element('span','reason',row.reason?(T[row.reason]||row.reason):(row.token?T.ready:'')));
 box.append(head,element('p','commenttext',row.text));
 if(row.token){
  box.append(element('div','replybox',row.reply));const button=element('button','primary',mode==='demo'?T.demoSend:T.send);button.type='button';
  button.addEventListener('click',()=>task(async()=>{
   if(!confirm(T.confirm+'\n'+T[row.action]+'\n@'+row.username+'\n\n'+row.reply))return;
   // Disable after any attempt, even a lost response, until state is re-read.
   button.disabled=true;
   try{const receipt=await api('send',{token:row.token,confirmed:true});box.append(element('p','receipt',(mode==='demo'?T.demoDone:T.accepted)+'\nID: '+receipt.receipt_id));}
   finally{await refreshStatus();}
  }));box.append(button);
 }
 $('rows').append(box);
 }
}

async function bootstrap(){
 try{const state=await request('/auth/status');mode=state.mode;
 $('mode').textContent=mode==='demo'?'DEMO / NO INSTAGRAM':'PRIVATE / EXPERIMENTAL';
 if(state.authenticated){csrf=state.csrf;await openWorkspace();}
 }catch(e){message(e.message,true);}
}
bootstrap();
</script></body></html>
